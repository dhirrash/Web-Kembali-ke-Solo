<!DOCTYPE html>
<html>
    <head>
        <title>Create</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Kodchasan:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Kode+Mono:wght@400..700&display=swap" rel="stylesheet">
    </head>
    <body>
    <!-- Layar "Menganalisa" ditampilkan saat menunggu AI (gaya sama dengan loading.html) -->
    <div id="loading-overlay" class="loading-overlay" hidden>
        <div class="loading-container">
            <div class="spinner"><img src="assets/loading.svg" alt="Loading"></div>
            <div class="loading-text">Menganalisa</div>
        </div>
    </div>
    <header>
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>
    <main class="create-container">
        <div class="upload-box" id="upload-box">
            <input type="file" id="image-upload" accept="image/*">

            <label for="image-upload" class="upload-content">
                <div class="upload-icon">+</div>
                <p>Upload gambar</p>
            </label>
        </div>
        <form class="item-form">
                <div class="form-group">
                    <label for="nama">Nama Barang</label>
                    <input type="text" id="nama" name="nama">
                </div>

                <div class="form-group">
                    <label>Kondisi</label>
                    <div class="rating">
                        <input
                            type="range"
                            id="kondisi"
                            name="kondisi"
                            min="1"
                            max="10"
                            step="1"
                            value="5"
                        >
                            <div class="rating-label">
                                <span>bad</span>
                                <span>good</span>
                            </div>
                        </div>
                    </div>

                <div class="form-group">
                    <label for="deskripsi">Deskripsi (opsional)</label>
                    <textarea id="deskripsi" name="deskripsi"></textarea>
                </div>

                <button type="submit">Analisa</button>
        </form>
    </main>
    <script src="create.js"></script>
        <script src="auth.js"></script>
    </body>
</html>
