<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>RE:LOOP — Profil</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Kodchasan:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Kode+Mono:wght@400..700&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
            <nav>
                <a href="index.html">Home</a>
                <a href="explore.html">Explore</a>
            </nav>
        </header>
        <main class="profil-container">
            <section class="profil-heading">
                <p class="profil-eyebrow">RE:LOOP ACCOUNT</p>
                <h2>Profil</h2>
                <p id="profil-nama" class="profil-nama">Memuat profil...</p>
                <p id="profil-email" class="profil-email"></p>
            </section>

            <section class="profil-section" aria-labelledby="inventaris-title">
                <div class="profil-section-heading">
                    <div>
                        <h3 id="inventaris-title">Barang Saya</h3>
                        <p>Barang yang pernah kamu analisa dan simpan ke inventaris.</p>
                    </div>
                    <a class="profil-link-button" href="create.html">+ Tambah Barang</a>
                </div>
                <p id="barang-status" class="empty-state">Memuat barang...</p>
                <ul id="barang-list" class="simpan-list"></ul>
            </section>

            <section class="profil-section" aria-labelledby="saved-title">
                <div class="profil-section-heading">
                    <div>
                        <h3 id="saved-title">Daftar Simpan</h3>
                        <p>Tutorial yang kamu simpan untuk dibuat nanti.</p>
                    </div>
                    <a class="profil-text-link" href="explore.html">Jelajahi ide</a>
                </div>
                <p id="simpan-status" class="empty-state">Memuat daftar simpan...</p>
                <ul id="simpan-list" class="simpan-list"></ul>
            </section>
        </main>
        <script src="auth.js"></script>
        <script src="profil.js"></script>
    </body>
</html>
